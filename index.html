<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Complaint Unit</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <iframe id="gasFrame"></iframe>

  <script>
    // URL Web App project Complaint Unit Anda
    const GAS_APP_URL = "https://script.google.com/macros/s/AKfycbylIIRgORMbDQtxKh0V4KKupFkpisasFjENmyPIyIT7ibD7n4fJpokYs_vL2w9j6h5Z/exec";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Tangkap data user Telegram
    const user = tg.initDataUnsafe?.user;
    const params = new URLSearchParams();

    if (user && user.id) {
      const fullName = [user.first_name, user.last_name].filter(Boolean).join(" ");
      params.set("uid", user.id);
      params.set("uname", fullName);
      params.set("username", user.username || "");
    }

    // Teruskan data user ke Google Apps Script Anda
    const finalUrl = params.toString() ? `${GAS_APP_URL}?${params.toString()}` : GAS_APP_URL;
    document.getElementById("gasFrame").src = finalUrl;
  </script>

</body>
</html>
